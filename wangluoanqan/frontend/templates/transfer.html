<!DOCTYPE html>
<html>
<head>
    <title>Transfer</title>
</head>
<body>
    <h1>Transfer</h1>
    {% if message %}<p style="color:green;">{{ message }}</p>{% endif %}
    {% if error %}<p style="color:red;">{{ error }}</p>{% endif %}
    <form method="post">
        <input type="text" name="account" placeholder="Account Number" required><br>
        <input type="number" step="0.01" name="amount" placeholder="Amount" required><br>
        <input type="text" name="description" placeholder="Description"><br>
        <button type="submit">Send</button>
    </form>
    <a href="{{ url_for('dashboard') }}">Back</a>
</body>
</html>
